name: release
run-name: ${{ github.actor }} is releasing ${{ github.ref_name }} 🚀

# NOTE: Pushing a tag `vX.Y.Z` publishes qlue-ls to crates.io, npm and PyPI.
# Running the workflow manually (workflow_dispatch) builds every package but
# publishes nothing, which is useful to test the pipeline.
#
# All three registries authenticate via OIDC trusted publishing, so no API
# tokens are stored as secrets. Each registry has to list this workflow
# (`release.yml`) and its environment as a trusted publisher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: 🏷️ check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Compare tag and crate version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qlue-ls") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  test:
    name: 🏗️ build & test
    uses: ./.github/workflows/ci.yml

  build-npm:
    name: 🕸️ build npm package
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: wasm-pack build
        run: wasm-pack build --release --target web
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: pkg/

  build-wheels:
    name: 🐍 build wheel (${{ matrix.platform.target }})
    needs: [check-version, test]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x64 }
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/

  build-sdist:
    name: 🐍 build sdist
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist/

  # NOTE: The publish jobs only start once every package has been built, so a
  # broken build never leaves the registries out of sync.
  publish-cratesio:
    name: 📦 publish to crates.io
    if: github.ref_type == 'tag'
    needs: [build-npm, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: 📦 publish to npm
    if: github.ref_type == 'tag'
    needs: [build-npm, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: pkg
      # INFO: trusted publishing requires npm >= 11.5.1, which ships with Node 24.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      # WARNING: npm rejects provenance unless `repository.url` in package.json
      # (taken from Cargo.toml) matches the GitHub repository running this job.
      - name: npm publish
        working-directory: pkg
        run: npm publish --access public

  publish-pypi:
    name: 📦 publish to PyPI
    if: github.ref_type == 'tag'
    needs: [build-npm, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
